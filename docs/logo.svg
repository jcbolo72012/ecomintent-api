<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1f35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Shopping cart icon (simplified) -->
  <g transform="translate(52, 38)">
    <!-- Cart body -->
    <path d="M8 6 L12 6 L16 28 L80 28 L88 10 L20 10"
          stroke="#3b82f6" stroke-width="5" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
    <!-- Wheels -->
    <circle cx="32" cy="36" r="5" fill="#3b82f6"/>
    <circle cx="68" cy="36" r="5" fill="#3b82f6"/>
    <!-- Handle dots (classification indicator) -->
    <circle cx="40" cy="19" r="3" fill="#06b6d4"/>
    <circle cx="56" cy="19" r="3" fill="#06b6d4"/>
    <circle cx="72" cy="19" r="3" fill="#06b6d4"/>
  </g>

  <!-- "EI" monogram -->
  <text x="100" y="125"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="52" font-weight="800"
        text-anchor="middle"
        fill="white"
        letter-spacing="-2">EI</text>

  <!-- Tagline -->
  <text x="100" y="155"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="500"
        text-anchor="middle"
        fill="#64748b"
        letter-spacing="2">INTENT API</text>

  <!-- Bottom accent line -->
  <rect x="75" y="167" width="50" height="2" rx="1" fill="url(#accent)"/>
</svg>
