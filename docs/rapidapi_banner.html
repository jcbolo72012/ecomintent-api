<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 400px; height: 400px; overflow: hidden; background: #0f1117; }

  .card {
    width: 400px;
    height: 400px;
    background: linear-gradient(145deg, #0f1117 0%, #1a1f2e 60%, #0f1117 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* subtle grid lines */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(99,179,237,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,179,237,0.04) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* top accent bar */
  .accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
  }

  .icon-row {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }

  .pill {
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    color: #60a5fa;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .pill.green {
    background: rgba(16,185,129,0.15);
    border-color: rgba(16,185,129,0.3);
    color: #34d399;
  }
  .pill.cyan {
    background: rgba(6,182,212,0.15);
    border-color: rgba(6,182,212,0.3);
    color: #22d3ee;
  }

  .logo {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 10px;
  }

  .logo-main {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .logo-sub {
    font-size: 13px;
    color: #64748b;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 6px;
    font-weight: 500;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: linear-gradient(90deg, #3b82f6, #06b6d4);
    border-radius: 2px;
    margin: 18px auto;
    position: relative;
    z-index: 1;
  }

  .intents {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    max-width: 320px;
    position: relative;
    z-index: 1;
    margin-bottom: 22px;
  }

  .intent-tag {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 10px;
    color: #94a3b8;
    font-weight: 500;
    letter-spacing: 0.04em;
    font-family: 'Consolas', 'SF Mono', monospace;
  }

  .stats {
    display: flex;
    gap: 28px;
    position: relative;
    z-index: 1;
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: #475569;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stat-sep {
    width: 1px;
    height: 32px;
    background: rgba(255,255,255,0.08);
    align-self: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="accent-bar"></div>

  <div class="icon-row">
    <div class="pill">DistilBERT</div>
    <div class="pill cyan">9 Intents</div>
    <div class="pill green">GPU Powered</div>
  </div>

  <div class="logo">
    <div class="logo-main">EcomIntent</div>
    <div class="logo-sub">E-commerce Intent Classifier</div>
  </div>

  <div class="divider"></div>

  <div class="intents">
    <span class="intent-tag">WISMO</span>
    <span class="intent-tag">RETURN_REQUEST</span>
    <span class="intent-tag">EXCHANGE_REQUEST</span>
    <span class="intent-tag">CANCEL_ORDER</span>
    <span class="intent-tag">DAMAGED_ITEM</span>
    <span class="intent-tag">BILLING_DISPUTE</span>
    <span class="intent-tag">PRODUCT_QUESTION</span>
    <span class="intent-tag">ACCOUNT_ISSUE</span>
    <span class="intent-tag">OTHER</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value">&lt;4ms</div>
      <div class="stat-label">Latency</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <div class="stat-value">99.9%</div>
      <div class="stat-label">F1 Score</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <div class="stat-value">15x</div>
      <div class="stat-label">Cheaper</div>
    </div>
  </div>
</div>
</body>
</html>
